[package]
name = "barq-chat-form-js"
version = "0.1.0"
edition = "2021"
description = "TypeScript/WASM bindings for barq-chat-form rendering engine"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
barq-chat-form-core = { path = "../barq-chat-form-core" }
uuid = { version = "1.0", features = ["v4", "js"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = []

[profile.release]
opt-level = "s"
