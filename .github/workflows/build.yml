name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        working-directory: formora-core
        run: cargo test --verbose

  build-python:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        working-directory: formora-py
        run: maturin build --release

  build-wasm:
    name: Build WASM / TypeScript package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build WASM package (bundler target)
        working-directory: formora-js
        run: wasm-pack build --target bundler --out-dir wasm --out-name formora_js
      - name: Install npm dependencies
        working-directory: formora-js
        run: npm ci
      - name: Type-check TypeScript
        working-directory: formora-js
        run: npm run typecheck
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: formora-js-wasm
          path: formora-js/wasm/
