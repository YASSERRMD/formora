name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    name: Test Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        working-directory: barq-chat-form-core
        run: cargo test --verbose

  build-python:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        working-directory: barq-chat-form-py
        run: maturin build --release

  build-go:
    name: Build Go bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-c-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build barq-chat-form-c shared library
        working-directory: barq-chat-form-c
        run: cargo build --release
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Vet Go package
        working-directory: barq-chat-form-go
        env:
          CGO_LDFLAGS: "-L${{ github.workspace }}/barq-chat-form-c/target/release"
          LD_LIBRARY_PATH: "${{ github.workspace }}/barq-chat-form-c/target/release"
        run: go vet ./barq/...

  build-csharp:
    name: Build C# bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-c2-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build barq-chat-form-c shared library
        working-directory: barq-chat-form-c
        run: cargo build --release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build BarqChatForm library
        working-directory: barq-chat-form-cs/src/BarqChatForm
        run: dotnet build -c Release
      - name: Build examples
        working-directory: barq-chat-form-cs
        run: |
          dotnet build examples/SimpleForm/SimpleForm.csproj -c Release
          dotnet build examples/MultistepForm/MultistepForm.csproj -c Release
          dotnet build examples/ConditionalForm/ConditionalForm.csproj -c Release

  build-wasm:
    name: Build WASM / TypeScript package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build WASM package (bundler target)
        working-directory: barq-chat-form-js
        run: wasm-pack build --target bundler --out-dir wasm --out-name barq_chat_form_js
      - name: Install npm dependencies
        working-directory: barq-chat-form-js
        run: npm ci
      - name: Type-check TypeScript
        working-directory: barq-chat-form-js
        run: npm run typecheck
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: barq-chat-form-js-wasm
          path: barq-chat-form-js/wasm/
