[package]
name = "barq-chat-form-c"
version = "0.1.0"
edition = "2021"
description = "C-compatible FFI bindings for barq-chat-form — used by Go and C# wrappers"
license = "MIT"

[lib]
name = "barq_chat_form_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde_json = "1.0"
barq-chat-form-core = { path = "../barq-chat-form-core" }
uuid = { version = "1.0", features = ["v4"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
